<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定价规则 — WeiHub Admin</title><link rel="stylesheet" href="css/style.css">
<style>
.info-banner {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--primary-light); border: 1px solid #c7d2fe;
  border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 24px; font-size: 13px; color: #3730a3; line-height: 1.6;
}
.info-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; color: var(--primary); }

.rules-wrap {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.rules-toolbar {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.rules-toolbar-title { font-size: 13px; font-weight: 600; }
.rules-toolbar-actions { display: flex; gap: 8px; }

.btn-edit {
  font-size: 12px; font-weight: 500; padding: 5px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text-secondary); transition: border-color .15s, color .15s;
}
.btn-edit:hover { border-color: var(--primary); color: var(--primary); }
.btn-save {
  font-size: 12px; font-weight: 500; padding: 5px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  border: none; background: var(--primary); color: #fff;
  transition: background .15s, opacity .15s;
}
.btn-save:hover { background: var(--primary-hover); }
.btn-save:disabled { opacity: .45; cursor: not-allowed; }
.btn-cancel {
  font-size: 12px; font-weight: 500; padding: 5px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary);
}
.btn-cancel:hover { border-color: #e5e7eb; background: var(--bg-muted); }

.rules-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rules-table thead tr { background: var(--bg-muted); border-bottom: 1.5px solid var(--border); }
.rules-table th {
  padding: 10px 16px; text-align: left;
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted); white-space: nowrap;
}
.rules-table th.th-c { color: #6366f1; }
.rules-table th.th-b { color: #8b5cf6; }
.rules-table th.th-r { color: #0ea5e9; }
.rules-table td { padding: 10px 16px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
.rules-table tr:last-child td { border-bottom: none; }
.rules-table tbody tr:hover td { background: #fafbff; }

.bracket-label { font-size: 13px; font-weight: 700; }
.bracket-label.l1 { color: #6366f1; }
.bracket-label.l2 { color: #7c3aed; }
.bracket-label.l3 { color: #9333ea; }
.bracket-label.l4 { color: #f59e0b; }
.bracket-label.l5 { color: #ef4444; }
.bracket-label.l6 { color: #94a3b8; }
.bracket-label.l7 { color: #94a3b8; }
.bracket-range { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: monospace; }

.ratio-val { font-size: 14px; font-weight: 700; color: var(--text); }

.ratio-input-wrap { display: flex; flex-direction: column; gap: 3px; }
.ratio-input {
  width: 72px; padding: 5px 8px; font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); outline: none;
  transition: border-color .15s;
}
.ratio-input:focus { border-color: var(--primary); }
.ratio-input.has-error { border-color: #ef4444 !important; }
.ratio-input:disabled { background: var(--bg-muted); color: var(--text-muted); cursor: not-allowed; }
.input-err-msg { font-size: 11px; color: #dc2626; }
.input-warn-msg { font-size: 11px; color: #d97706; }


/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-60px);
  background: #111827; color: #fff; font-size: 13px; font-weight: 500;
  padding: 9px 18px; border-radius: 8px; z-index: 9999;
  display: flex; align-items: center; gap: 8px;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  opacity: 0; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.toast-success { background: #166534; }
.toast svg { width: 14px; height: 14px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="app"><div id="sidebar-mount"></div><div class="main">
<header class="header">
  <div class="header-title">定价规则</div>
  <div class="header-actions">
    <div class="header-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:13px;height:13px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Root
    </div>
  </div>
</header>
<main class="page">

<div class="page-header">
  <div class="page-header-left">
    <h1>定价规则</h1>
    <div class="subtitle">成本区间与各客户层售价比例，标准价格模版基于此规则自动计算</div>
  </div>
</div>

<div class="info-banner">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <div>
    系统根据每个模型的<strong>采购折扣率</strong>（采购价 ÷ 官网原价）判断所属成本区间，再乘以对应售价比例得出最终定价。区间采用<strong>左开右闭</strong>原则，任意精度的折扣率均有唯一归属（如 3.65折 → 3.5–4.5折区间）。
  </div>
</div>

<div class="rules-wrap">
  <div class="rules-toolbar">
    <div class="rules-toolbar-title">成本区间 × 售价比例</div>
    <div class="rules-toolbar-actions" id="toolbarActions"></div>
  </div>
  <table class="rules-table">
    <thead>
      <tr>
        <th style="min-width:140px;">成本区间</th>
        <th class="th-c">C端比例</th>
        <th class="th-b">B端比例</th>
        <th class="th-r">代理商比例</th>
      </tr>
    </thead>
    <tbody id="rulesBody"></tbody>
  </table>
</div>

</main></div></div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastMsg">规则已保存</span>
</div>

<script src="js/sidebar.js"></script>
<script src="js/common.js"></script>
<script>
let BRACKETS = [
  { label:'≤3.5折',    range:'[0, 3.5]',   costMax:0.35, c:80,  b:70,  r:60,  labelClass:'l1', locked:false },
  { label:'3.5–4.5折', range:'(3.5, 4.5]', costMax:0.45, c:85,  b:75,  r:65,  labelClass:'l2', locked:false },
  { label:'4.5–6折',   range:'(4.5, 6]',   costMax:0.60, c:90,  b:80,  r:70,  labelClass:'l3', locked:false },
  { label:'6–7折',     range:'(6, 7]',      costMax:0.70, c:90,  b:85,  r:80,  labelClass:'l4', locked:false },
  { label:'7–8折',     range:'(7, 8]',      costMax:0.80, c:95,  b:90,  r:85,  labelClass:'l5', locked:false },
  { label:'8–9折',     range:'(8, 9]',      costMax:0.90, c:95,  b:90,  r:90,  labelClass:'l6', locked:false },
  { label:'原价',       range:'(9, 10]',     costMax:1.00, c:100, b:100, r:100, labelClass:'l7', locked:true  },
];

let editMode = false;
let draft = [];  // working copy during edit


function renderView() {
  document.getElementById('rulesBody').innerHTML = BRACKETS.map(br => `
    <tr>
      <td>
        <div class="bracket-label ${br.labelClass}">${br.label}</div>
        <div class="bracket-range">${br.range}</div>
      </td>
      <td><span class="ratio-val">${br.c}%</span></td>
      <td><span class="ratio-val">${br.b}%</span></td>
      <td><span class="ratio-val">${br.r}%</span></td>
    </tr>`).join('');

  document.getElementById('toolbarActions').innerHTML =
    `<button class="btn-edit" onclick="enterEdit()">编辑</button>`;
}

function renderEdit() {
  document.getElementById('rulesBody').innerHTML = draft.map((br, i) => `
    <tr>
      <td>
        <div class="bracket-label ${br.labelClass}">${br.label}</div>
        <div class="bracket-range">${br.range}</div>
      </td>
      <td>${ratioCell(i, 'c', br.locked)}</td>
      <td>${ratioCell(i, 'b', br.locked)}</td>
      <td>${ratioCell(i, 'r', br.locked)}</td>
    </tr>`).join('');

  document.getElementById('toolbarActions').innerHTML = `
    <button class="btn-cancel" onclick="cancelEdit()">取消</button>
    <button class="btn-save" id="btnSave" onclick="saveEdit()">保存</button>`;
}

function ratioCell(i, tier, locked) {
  const val = draft[i][tier];
  if (locked) {
    return `<span class="ratio-val">${val}%</span>`;
  }
  return `<div class="ratio-input-wrap">
    <input class="ratio-input" type="number" min="1" max="100" step="1"
      id="inp-${i}-${tier}" value="${val}"
      oninput="onInput(${i},'${tier}',this.value)"
      onblur="onInput(${i},'${tier}',this.value)">
    <span class="input-err-msg" id="err-${i}-${tier}"></span>
  </div>`;
}

function onInput(i, tier, raw) {
  const val = parseInt(raw, 10);
  draft[i][tier] = isNaN(val) ? draft[i][tier] : val;
  validateAll();
}

function validateAll() {
  let hasError = false;

  draft.forEach((br, i) => {
    if (br.locked) return;
    ['c','b','r'].forEach(t => {
      const inp = document.getElementById(`inp-${i}-${t}`);
      const err = document.getElementById(`err-${i}-${t}`);
      if (!inp) return;
      const v = parseInt(inp.value, 10);
      let msg = '';

      if (isNaN(v) || v < 1 || v > 100) {
        msg = '请输入 1–100 的整数';
        inp.classList.add('has-error');
        hasError = true;
      } else {
        inp.classList.remove('has-error');
      }
      err.textContent = msg;
    });

    // tier order check: c >= b >= r
    const ci = parseInt(document.getElementById(`inp-${i}-c`)?.value, 10);
    const bi = parseInt(document.getElementById(`inp-${i}-b`)?.value, 10);
    const ri = parseInt(document.getElementById(`inp-${i}-r`)?.value, 10);

    if (!isNaN(ci) && !isNaN(bi) && bi > ci) {
      document.getElementById(`inp-${i}-b`).classList.add('has-error');
      document.getElementById(`err-${i}-b`).textContent = 'B端不可高于C端';
      hasError = true;
    }
    if (!isNaN(bi) && !isNaN(ri) && ri > bi) {
      document.getElementById(`inp-${i}-r`).classList.add('has-error');
      document.getElementById(`err-${i}-r`).textContent = '代理商不可高于B端';
      hasError = true;
    }
  });

  document.getElementById('btnSave').disabled = hasError;
  return !hasError;
}

function enterEdit() {
  draft = BRACKETS.map(br => ({ ...br }));
  editMode = true;
  renderEdit();
}

function cancelEdit() {
  editMode = false;
  draft = [];
  renderView();
}

function saveEdit() {
  // read latest input values into draft
  draft.forEach((br, i) => {
    if (br.locked) return;
    ['c','b','r'].forEach(t => {
      const inp = document.getElementById(`inp-${i}-${t}`);
      if (inp) {
        const v = parseInt(inp.value, 10);
        if (!isNaN(v)) draft[i][t] = v;
      }
    });
  });

  if (!validateAll()) return;

  BRACKETS = draft.map(br => ({ ...br }));
  editMode = false;
  draft = [];
  renderView();
  showToast('规则已保存');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.classList.add('show', 'toast-success');
  setTimeout(() => el.classList.remove('show', 'toast-success'), 2200);
}

// Init
renderView();
</script>
</body></html>

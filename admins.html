<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员 — WeiHub Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-mount"></div>
  <div class="main">
    <header class="header">
      <div class="header-title">管理员</div>
      <div class="header-actions">
        <div class="header-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Root
        </div>
      </div>
    </header>
    <main class="page">
      <div class="page-header">
        <div class="page-header-left">
          <h1>管理员账号</h1>
          <div class="subtitle">管理有权访问后台的管理员账号及权限</div>
        </div>
        <div class="page-header-right">
          <button class="btn btn-primary" onclick="openModal('createModal')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加管理员
          </button>
        </div>
      </div>

      <div class="card" style="padding:0">
        <table class="table">
          <thead>
            <tr>
              <th>管理员</th>
              <th>角色</th>
              <th>最后登录</th>
              <th>登录 IP</th>
              <th>状态</th>
              <th>创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="avatar" style="width:30px;height:30px;font-size:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;">R</div>
                  <div>
                    <div style="font-size:13px;font-weight:500;">Root</div>
                    <div style="font-size:11px;color:var(--text-muted);">root@weihub.io</div>
                  </div>
                </div>
              </td>
              <td><span class="badge badge-primary">超级管理员</span></td>
              <td style="font-size:12px;color:var(--text-muted);">今日 10:24</td>
              <td style="font-size:12px;color:var(--text-muted);">192.168.1.1</td>
              <td><span class="badge badge-success">正常</span></td>
              <td style="font-size:12px;color:var(--text-muted);">2025-01-01</td>
              <td><span style="color:var(--text-muted);font-size:12px;">—</span></td>
            </tr>
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="avatar" style="width:30px;height:30px;font-size:12px;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;">A</div>
                  <div>
                    <div style="font-size:13px;font-weight:500;">Alice</div>
                    <div style="font-size:11px;color:var(--text-muted);">alice@weihub.io</div>
                  </div>
                </div>
              </td>
              <td><span class="badge badge-info">运营管理员</span></td>
              <td style="font-size:12px;color:var(--text-muted);">昨日 18:42</td>
              <td style="font-size:12px;color:var(--text-muted);">10.0.0.5</td>
              <td><span class="badge badge-success">正常</span></td>
              <td style="font-size:12px;color:var(--text-muted);">2026-01-15</td>
              <td>
                <button class="action-link blue" onclick="openModal('editModal')">编辑</button>
                <button class="action-link red" onclick="openModal('confirmModal')">删除</button>
              </td>
            </tr>
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="avatar" style="width:30px;height:30px;font-size:12px;background:#0891b2;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;">B</div>
                  <div>
                    <div style="font-size:13px;font-weight:500;">Bob</div>
                    <div style="font-size:11px;color:var(--text-muted);">bob@weihub.io</div>
                  </div>
                </div>
              </td>
              <td><span class="badge badge-neutral">只读管理员</span></td>
              <td style="font-size:12px;color:var(--text-muted);">3 天前</td>
              <td style="font-size:12px;color:var(--text-muted);">172.16.0.2</td>
              <td><span class="badge badge-warning">已禁用</span></td>
              <td style="font-size:12px;color:var(--text-muted);">2026-03-01</td>
              <td>
                <button class="action-link blue" onclick="openModal('editModal')">编辑</button>
                <button class="action-link red" onclick="openModal('confirmModal')">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Create Modal -->
<div class="modal-overlay" id="createModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">添加管理员</div>
      <button class="modal-close" onclick="closeModal('createModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input class="input" type="text" placeholder="英文用户名">
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input class="input" type="email" placeholder="admin@weihub.io">
      </div>
      <div class="form-group">
        <label class="form-label">初始密码</label>
        <input class="input" type="password" placeholder="至少 8 位">
      </div>
      <div class="form-group">
        <label class="form-label">角色</label>
        <select class="select" style="width:100%">
          <option>运营管理员</option>
          <option>财务管理员</option>
          <option>只读管理员</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('createModal')">取消</button>
      <button class="btn btn-primary">添加</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">编辑管理员</div>
      <button class="modal-close" onclick="closeModal('editModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">角色</label>
        <select class="select" style="width:100%">
          <option>运营管理员</option>
          <option>财务管理员</option>
          <option selected>只读管理员</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">状态</label>
        <select class="select" style="width:100%">
          <option>正常</option>
          <option selected>已禁用</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">重置密码（可选）</label>
        <input class="input" type="password" placeholder="留空则不修改">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editModal')">取消</button>
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="modal-overlay" id="confirmModal" style="display:none">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-title">确认删除</div>
      <button class="modal-close" onclick="closeModal('confirmModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-secondary);">删除后该账号将无法登录后台，操作不可撤销。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn" style="background:var(--danger);color:#fff;">确认删除</button>
    </div>
  </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/common.js"></script>
</body>
</html>

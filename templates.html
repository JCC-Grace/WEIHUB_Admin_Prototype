<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格模版 — WeiHub Admin</title><link rel="stylesheet" href="css/style.css">
<style>
/* ── Type badges ── */
.type-b { background: #eef2ff; color: #4338ca; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.type-r { background: #e0f2fe; color: #0369a1; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }

/* ── Discount pill ── */
.disc-num { font-size: 14px; font-weight: 700; color: var(--text); }
.disc-sub { font-size: 11px; color: var(--text-muted); }

/* ── Action links ── */
.action-link { font-size: 12px; font-weight: 500; cursor: pointer; }
.action-link.blue  { color: var(--primary); }
.action-link.blue:hover  { text-decoration: underline; }
.action-link.red   { color: var(--danger); }
.action-link.red:hover   { text-decoration: underline; }
.flex { display: flex; }
.gap-2 { gap: 8px; }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }
.modal-card {
  background: var(--bg); border-radius: var(--radius-lg);
  width: 560px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
  transform: translateY(10px); transition: transform .18s;
}
.modal-backdrop.open .modal-card { transform: translateY(0); }
.modal-header {
  padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 15px; font-weight: 700; }
.modal-close {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; transition: background .12s;
}
.modal-close:hover { background: var(--bg-muted); color: var(--text); }
.modal-close svg { width: 16px; height: 16px; }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 0 24px 20px; display: flex; justify-content: flex-end; gap: 8px;
}

/* ── Form ── */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 6px;
}
.form-label span { color: var(--danger); margin-left: 2px; }
.form-input {
  width: 100%; padding: 8px 12px; font-size: 13px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); outline: none;
  transition: border-color .15s;
}
.form-input:focus { border-color: var(--primary); }
.form-input.short { width: 120px; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.form-textarea { resize: vertical; min-height: 72px; }

/* Radio group */
.radio-group { display: flex; gap: 10px; }
.radio-card {
  flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 14px; cursor: pointer; transition: border-color .15s, background .15s;
  display: flex; align-items: center; gap: 10px;
}
.radio-card:hover { border-color: #c7d2fe; }
.radio-card.selected { border-color: var(--primary); background: #f5f3ff; }
.radio-card input { display: none; }
.radio-dot {
  width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: border-color .15s;
}
.radio-card.selected .radio-dot { border-color: var(--primary); }
.radio-dot::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary); display: none;
}
.radio-card.selected .radio-dot::after { display: block; }
.radio-label { font-size: 13px; font-weight: 500; }
.radio-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

/* Discount input row */
.disc-input-row { display: flex; align-items: center; gap: 8px; }
.disc-suffix { font-size: 13px; color: var(--text-muted); }

/* btn */
.btn-primary-sm {
  padding: 7px 16px; font-size: 13px; font-weight: 500;
  background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-sm); cursor: pointer; transition: background .15s;
}
.btn-primary-sm:hover { background: var(--primary-hover); }
.btn-ghost-sm {
  padding: 7px 16px; font-size: 13px; font-weight: 500;
  background: var(--bg); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
}
.btn-ghost-sm:hover { background: var(--bg-muted); }

/* ── Detail Drawer ── */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.2);
  z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.drawer-backdrop.open { opacity: 1; pointer-events: all; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 70vw; min-width: 700px;
  background: var(--bg); border-left: 1px solid var(--border);
  z-index: 91; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow: -8px 0 32px rgba(0,0,0,.08);
}
.drawer-backdrop.open .drawer { transform: translateX(0); }

.drawer-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0;
}
.drawer-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.drawer-name { font-size: 16px; font-weight: 700; }
.drawer-close {
  width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; transition: background .12s;
}
.drawer-close:hover { background: var(--bg-muted); color: var(--text); }
.drawer-close svg { width: 18px; height: 18px; }

.drawer-meta {
  display: flex; gap: 28px; padding: 16px 24px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.meta-item { }
.meta-label { font-size: 11px; color: var(--text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.meta-val { font-size: 14px; font-weight: 600; color: var(--text); }
.meta-val.big { font-size: 20px; font-weight: 700; color: var(--primary); }

.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }

.drawer-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
}

.pricing-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.pricing-table thead th {
  padding: 8px 12px; text-align: left; background: var(--bg-muted);
  border-bottom: 1.5px solid var(--border);
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted); white-space: nowrap;
}
.pricing-table tbody td {
  padding: 10px 12px; border-bottom: 1px solid var(--border-light); vertical-align: middle;
}
.pricing-table tbody tr:last-child td { border-bottom: none; }
.pricing-table tbody tr:hover td { background: #fafbff; }
.p-name { font-weight: 500; font-size: 12px; }
.p-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }
.p-base { font-size: 12px; color: var(--text-muted); }
.p-tpl { font-size: 13px; font-weight: 600; color: var(--text); }
.p-disc-pill {
  font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px;
  background: #dcfce7; color: #16a34a;
}
.p-disc-same { font-size: 11px; color: var(--text-muted); font-style: italic; }
.vendor-row td {
  background: var(--bg-muted); padding: 4px 12px;
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted);
  border-bottom: none !important;
}

/* ── Bracket table inside modal ── */
.bracket-tbl { width:100%; border-collapse:collapse; font-size:12px; }
.bracket-tbl th {
  padding:7px 12px; text-align:left;
  font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); background:var(--bg-muted);
  border-bottom:1px solid var(--border);
}
.bracket-tbl th.th-ref    { color:#4338ca; }
.bracket-tbl th.th-custom { color:var(--primary); }
.bracket-tbl td { padding:7px 12px; border-bottom:1px solid var(--border-light); vertical-align:middle; }
.bracket-tbl tr:last-child td { border-bottom:none; }
.b-label { font-size:12px; font-weight:600; color:var(--text); }
.b-range { font-size:10px; color:var(--text-muted); font-family:monospace; margin-top:1px; }
.ref-val { font-size:13px; font-weight:700; color:#4338ca; }
.ref-na  { font-size:11px; color:var(--text-muted); font-style:italic; }
.bracket-input {
  width:60px; padding:4px 8px; font-size:13px; font-weight:600;
  border:1.5px solid var(--border); border-radius:var(--radius-sm);
  background:var(--bg); color:var(--text); outline:none; transition:border-color .15s;
}
.bracket-input:focus { border-color:var(--primary); }
.bracket-input:disabled { background:var(--bg-muted); color:var(--text-muted); cursor:not-allowed; }

/* ── Tabs ── */
.tab-bar {
  display: flex; gap: 0; border-bottom: 1.5px solid var(--border);
  margin-bottom: 16px;
}
.tab {
  padding: 9px 18px; font-size: 13px; font-weight: 500;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1.5px; transition: color .15s, border-color .15s;
  display: flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-count {
  font-size: 11px; font-weight: 600; padding: 1px 6px;
  border-radius: 10px; background: var(--bg-muted); color: var(--text-muted);
}
.tab.active .tab-count { background: #eef2ff; color: var(--primary); }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-60px);
  background: #166534; color: #fff; font-size: 13px; font-weight: 500;
  padding: 9px 18px; border-radius: 8px; z-index: 999;
  display: flex; align-items: center; gap: 8px;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s; opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="app"><div id="sidebar-mount"></div><div class="main">
<header class="header">
  <div class="header-title">价格模版</div>
  <div class="header-actions">
    <div class="header-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:13px;height:13px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Root
    </div>
  </div>
</header>
<main class="page">

<div class="page-header">
  <div class="page-header-left">
    <h1>价格模版</h1>
    <div class="subtitle">为企业客户或代理商创建定制定价方案，在标准模版基础上额外议价</div>
  </div>
  <div class="page-header-actions">
    <button class="btn-primary-sm" onclick="openCreate()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:14px;height:14px;margin-right:4px;vertical-align:middle"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建模版
    </button>
  </div>
</div>

<!-- Tabs -->
<div class="tab-bar">
  <div class="tab active" id="tab-b" onclick="setTab('b')">
    B端企业 <span class="tab-count" id="cnt-b"></span>
  </div>
  <div class="tab" id="tab-r" onclick="setTab('r')">
    代理商 <span class="tab-count" id="cnt-r"></span>
  </div>
</div>

<div class="toolbar" style="margin-bottom:16px;">
  <div class="search-input">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="搜索模版名称或关联客户…" oninput="renderList()">
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>模版名称</th>
        <th>客户类型</th>
        <th>额外折扣</th>
        <th>关联客户数</th>
        <th>创建时间</th>
        <th class="text-center">状态</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
</div>

</main></div></div>

<!-- ── Create Modal ── -->
<div class="modal-backdrop" id="createModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">新建价格模版</div>
      <div class="modal-close" onclick="closeCreate()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div class="modal-body">

      <div class="form-group">
        <label class="form-label">模版名称<span>*</span></label>
        <input class="form-input" id="fName" type="text" placeholder="如：字节跳动专属方案">
      </div>

      <div class="form-group">
        <label class="form-label">客户类型<span>*</span></label>
        <div class="radio-group">
          <div class="radio-card selected" id="rc-b" onclick="selectType('b')">
            <div class="radio-dot"></div>
            <div>
              <div class="radio-label">B端企业</div>
              <div class="radio-sub">在标准 B端价基础上议价</div>
            </div>
          </div>
          <div class="radio-card" id="rc-r" onclick="selectType('r')">
            <div class="radio-dot"></div>
            <div>
              <div class="radio-label">代理商</div>
              <div class="radio-sub">在标准代理商价基础上议价</div>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">按成本区间设置售价比例<span>*</span></label>
        <div class="form-hint" style="margin-bottom:8px;">左列为标准比例（参考），右列可逐行修改。比例直接对应官网原价，确保高于采购成本避免亏损。</div>
        <div style="border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;">
          <table class="bracket-tbl">
            <thead>
              <tr>
                <th>成本区间</th>
                <th class="th-ref" id="th-ref-label">标准比例</th>
                <th class="th-custom">本模版</th>
              </tr>
            </thead>
            <tbody id="bracketBody"></tbody>
          </table>
        </div>
        <!-- Live price preview -->
        <div id="pricePreview" style="margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;"></div>
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">备注</label>
        <textarea class="form-input form-textarea" id="fNote" placeholder="合同编号、有效期或其他备注（可选）"></textarea>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-ghost-sm" onclick="closeCreate()">取消</button>
      <button class="btn-primary-sm" onclick="submitCreate()">创建模版</button>
    </div>
  </div>
</div>

<!-- ── Detail Drawer ── -->
<div class="drawer-backdrop" id="detailDrawer" onclick="handleBackdropClick(event)">
  <div class="drawer" id="drawerPanel">
    <div class="drawer-header">
      <div>
        <div class="drawer-title-row">
          <span class="drawer-name" id="dName"></span>
          <span id="dTypeBadge"></span>
          <span id="dStatusBadge"></span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;" id="dCustomer"></div>
      </div>
      <div class="drawer-close" onclick="closeDrawer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div class="drawer-meta">
      <div class="meta-item">
        <div class="meta-label">比例范围</div>
        <div class="meta-val big" id="dDiscount"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">基于模版</div>
        <div class="meta-val" id="dBase"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">创建时间</div>
        <div class="meta-val" id="dCreated"></div>
      </div>
      <div class="meta-item">
        <div class="meta-label">备注</div>
        <div class="meta-val" id="dNote" style="font-weight:400;font-size:12px;color:var(--text-muted);max-width:160px;"></div>
      </div>
    </div>
    <div class="drawer-body">
      <div class="drawer-section-title">模型定价</div>
      <div class="table-wrap" style="border-radius:8px;">
        <table class="pricing-table">
          <thead>
            <tr>
              <th>模型</th>
              <th>计费</th>
              <th>官网原价·输入</th>
              <th>官网原价·输出</th>
              <th>标准价·输入</th>
              <th>标准价·输出</th>
              <th>本模版·输入</th>
              <th>本模版·输出</th>
              <th>标准折扣</th>
              <th>综合折扣</th>
            </tr>
          </thead>
          <tbody id="drawerBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastMsg"></span>
</div>

<script src="js/sidebar.js"></script>
<script src="js/common.js"></script>
<script>
// ── Model data ──────────────────────────────────────────────
const MODELS = [
  { name:'Qwen3-Max',       id:'qwen3-max',    vendor:'阿里云',   billing:'text/token',   officialIn:2.5,  officialOut:10,  costRate:0.35 },
  { name:'Qwen3.5-Plus',    id:'qwen3.5-plus', vendor:'阿里云',   billing:'text/token',   officialIn:0.8,  officialOut:4.8, costRate:0.35 },
  { name:'Qwen3-235B-A22B', id:'qwen3-235b',   vendor:'阿里云',   billing:'text/token',   officialIn:2.0,  officialOut:8.0, costRate:0.35 },
  { name:'Qwen3-14B',       id:'qwen3-14b',    vendor:'阿里云',   billing:'text/token',   officialIn:1.0,  officialOut:4.0, costRate:0.35 },
  { name:'Wan2.6-Image',    id:'wan2.6-image', vendor:'阿里云',   billing:'image/image',  officialIn:0.20, officialOut:null, costRate:0.35 },
  { name:'DeepSeek-V3.2',   id:'deepseek-v3',  vendor:'DeepSeek', billing:'text/token',   officialIn:2.0,  officialOut:3.0, costRate:0.60 },
  { name:'GLM-5',           id:'glm-5',        vendor:'智谱',    billing:'text/token',   officialIn:4.0,  officialOut:18,  costRate:1.00 },
  { name:'Kimi-K2.6',       id:'kimi-k2.6',    vendor:'月之暗面', billing:'text/token',   officialIn:6.5,  officialOut:27,  costRate:1.00 },
];
const VENDOR_ORDER = ['阿里云','DeepSeek','智谱','月之暗面'];

function getBracket(rate) {
  if (rate <= 0.35) return { c:0.80, b:0.70, r:0.60 };
  if (rate <= 0.45) return { c:0.85, b:0.75, r:0.65 };
  if (rate <= 0.60) return { c:0.90, b:0.80, r:0.70 };
  if (rate <= 0.70) return { c:0.90, b:0.85, r:0.80 };
  if (rate <= 0.80) return { c:0.95, b:0.90, r:0.85 };
  if (rate <= 0.90) return { c:0.95, b:0.90, r:0.90 };
  return { c:1.00, b:1.00, r:1.00 };
}

function fmt(v) {
  if (v === null || v === undefined) return '—';
  return '¥' + (v % 1 === 0 ? v.toFixed(0) : v.toFixed(v % 0.1 === 0 ? 1 : 2));
}

// ── Templates data ──────────────────────────────────────────
// ratios[0..5] = 6 editable brackets (≤3.5折 → 8–9折), ratios[6] = 原价 (locked)
// B端 standard:    [70, 75, 80, 85, 90, 90, 100]
// 代理商 standard: [60, 65, 70, 80, 85, 90, null]
let TEMPLATES = [
  { id:1, name:'字节跳动专属',     type:'b', ratios:[66, 71, 76, 81, 86, 86, 100], customers:['字节跳动有限公司'],                                   note:'2026 年度合同', status:'active', createdAt:'2026-03-15' },
  { id:2, name:'腾讯云合作方案',   type:'b', ratios:[64, 69, 74, 79, 85, 85, 100], customers:['腾讯云计算（北京）有限责任公司','腾讯音乐娱乐集团'],   note:'',              status:'active', createdAt:'2026-04-02' },
  { id:3, name:'代理商A · 方案1', type:'r', ratios:[54, 59, 63, 72, 77, 81, null], customers:['北京某科技代理商'],                                    note:'面向小型企业',  status:'active', createdAt:'2026-04-10' },
  { id:4, name:'代理商A · 方案2', type:'r', ratios:[51, 56, 60, 68, 73, 77, null], customers:['北京某科技代理商','上海数聚信息技术有限公司'],          note:'面向中型企业',  status:'active', createdAt:'2026-04-10' },
];
let nextId = 6;

// ── Tabs ─────────────────────────────────────────────────────
let currentTab = 'b';

function setTab(t) {
  currentTab = t;
  document.getElementById('tab-b').classList.toggle('active', t === 'b');
  document.getElementById('tab-r').classList.toggle('active', t === 'r');
  renderList();
}

function updateCounts() {
  document.getElementById('cnt-b').textContent = TEMPLATES.filter(x => x.type === 'b' && x.status === 'active').length;
  document.getElementById('cnt-r').textContent = TEMPLATES.filter(x => x.type === 'r' && x.status === 'active').length;
}

// ── List render ──────────────────────────────────────────────
function renderList() {
  updateCounts();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const rows = TEMPLATES.filter(t =>
    t.type === currentTab && t.status === 'active' &&
    (t.name.toLowerCase().includes(q) || t.customers.some(c => c.toLowerCase().includes(q)))
  );
  const tbody = document.getElementById('listBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted);">无匹配模版</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(t => `
    <tr style="cursor:pointer" onclick="openDrawer(${t.id})">
      <td>
        <div class="td-primary">${t.name}</div>
      </td>
      <td>${t.type === 'b'
        ? '<span class="type-b">B端企业</span>'
        : '<span class="type-r">代理商</span>'}</td>
      <td>
        <div class="disc-num">${t.ratios[0]}%</div>
        <div class="disc-sub">≤3.5折区间 · 官网</div>
      </td>
      <td><span style="font-size:13px;font-weight:600;color:var(--text)">${t.customers.length}</span><span style="font-size:11px;color:var(--text-muted);margin-left:3px;">家</span></td>
      <td><span style="font-size:12px;color:var(--text-muted)">${t.createdAt}</span></td>
      <td class="text-center">
        ${t.status === 'active'
          ? '<span class="badge badge-success">生效</span>'
          : '<span class="badge badge-neutral">已归档</span>'}
      </td>
      <td onclick="event.stopPropagation()">
        <div class="flex gap-2">
          <span class="action-link blue" onclick="openDrawer(${t.id})">查看</span>
          ${t.status === 'active'
            ? `<span class="action-link red" onclick="archiveTemplate(${t.id})">停用</span>`
            : ''}
        </div>
      </td>
    </tr>`).join('');
}

// ── Bracket metadata (shared between modal + drawer) ──────────
const FORM_BRACKETS = [
  { label:'≤3.5折',    range:'[0, 3.5]',   costMax:0.35, b:70,  r:60,  locked:false },
  { label:'3.5–4.5折', range:'(3.5, 4.5]', costMax:0.45, b:75,  r:65,  locked:false },
  { label:'4.5–6折',   range:'(4.5, 6]',   costMax:0.60, b:80,  r:70,  locked:false },
  { label:'6–7折',     range:'(6, 7]',      costMax:0.70, b:85,  r:80,  locked:false },
  { label:'7–8折',     range:'(7, 8]',      costMax:0.80, b:90,  r:85,  locked:false },
  { label:'8–9折',     range:'(8, 9]',      costMax:0.90, b:90,  r:90,  locked:false },
  { label:'原价',       range:'(9, 10]',     costMax:1.00, b:100, r:null, locked:true  },
];

function bracketIndexFor(costRate) {
  return FORM_BRACKETS.findIndex(br => costRate <= br.costMax);
}

// ── Create modal ──────────────────────────────────────────────
let selectedType = 'b';

function selectType(t) {
  selectedType = t;
  document.getElementById('rc-b').classList.toggle('selected', t === 'b');
  document.getElementById('rc-r').classList.toggle('selected', t === 'r');
  renderBracketTable();
}

function renderBracketTable(existingRatios) {
  const tier = selectedType;
  document.getElementById('th-ref-label').textContent = tier === 'b' ? 'B端标准' : '代理商标准';
  document.getElementById('bracketBody').innerHTML = FORM_BRACKETS.map((br, i) => {
    const refVal = br[tier];
    const isLocked = br.locked || (tier === 'r' && refVal === null);
    const inputVal = existingRatios ? existingRatios[i] : refVal;
    return `<tr>
      <td><div class="b-label">${br.label}</div><div class="b-range">${br.range}</div></td>
      <td>${refVal !== null ? `<span class="ref-val">${refVal}%</span>` : `<span class="ref-na">不开放</span>`}</td>
      <td>${isLocked
        ? (refVal !== null ? `<span style="font-size:13px;font-weight:600;color:var(--text-muted)">${refVal}%</span>` : `<span class="ref-na">不开放</span>`)
        : `<div style="display:flex;align-items:center;gap:4px;">
             <input class="bracket-input" type="number" min="1" max="100"
               id="bi-${i}" value="${inputVal}" oninput="updatePreview()">
             <span style="font-size:12px;color:var(--text-muted)">%</span>
           </div>`}
      </td>
    </tr>`;
  }).join('');
  updatePreview();
}

function openCreate() {
  document.getElementById('fName').value = '';
  document.getElementById('fNote').value = '';
  selectType(currentTab);
  document.getElementById('createModal').classList.add('open');
}
function closeCreate() {
  document.getElementById('createModal').classList.remove('open');
}
function submitCreate() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { document.getElementById('fName').focus(); return; }
  const ratios = FORM_BRACKETS.map((br, i) => {
    const inp = document.getElementById(`bi-${i}`);
    if (!inp) return br[selectedType]; // locked row
    const v = parseInt(inp.value, 10);
    return isNaN(v) ? br[selectedType] : v;
  });
  TEMPLATES.push({
    id: nextId++, name, type: selectedType, ratios,
    customers: [],
    note: document.getElementById('fNote').value.trim(),
    status: 'active',
    createdAt: new Date().toISOString().slice(0,10),
  });
  closeCreate();
  renderList();
  showToast('模版已创建');
}

// ── Detail drawer ──────────────────────────────────────────────
function openDrawer(id) {
  const t = TEMPLATES.find(x => x.id === id);
  if (!t) return;

  document.getElementById('dName').textContent = t.name;
  document.getElementById('dTypeBadge').innerHTML = t.type === 'b'
    ? '<span class="type-b">B端企业</span>'
    : '<span class="type-r">代理商</span>';
  document.getElementById('dStatusBadge').innerHTML = t.status === 'active'
    ? '<span class="badge badge-success">生效</span>'
    : '<span class="badge badge-neutral">已归档</span>';
  document.getElementById('dCustomer').textContent = t.customers.length ? t.customers.join('、') : '';
  // Show ratio range in meta (min–max of non-null ratios)
  const validRatios = t.ratios.filter(r => r !== null);
  const minR = Math.min(...validRatios), maxR = Math.max(...validRatios);
  document.getElementById('dDiscount').textContent = minR === maxR ? minR + '%' : minR + '%–' + maxR + '%';
  document.getElementById('dBase').textContent = t.type === 'b' ? '标准 B端模版' : '标准代理商模版';
  document.getElementById('dCreated').textContent = t.createdAt;
  document.getElementById('dNote').textContent = t.note || '—';

  // render pricing table
  const tier = t.type; // 'b' or 'r'
  const grouped = {};
  MODELS.forEach(m => {
    if (!grouped[m.vendor]) grouped[m.vendor] = [];
    grouped[m.vendor].push(m);
  });
  let html = '';
  VENDOR_ORDER.forEach(vendor => {
    if (!grouped[vendor]) return;
    html += `<tr class="vendor-row"><td colspan="10">${vendor}</td></tr>`;
    grouped[vendor].forEach(m => {
      const bIdx = bracketIndexFor(m.costRate);
      const br = FORM_BRACKETS[bIdx];
      const stdPct = br[tier];           // standard ratio as integer % (e.g. 70)
      const tplPct = t.ratios[bIdx];     // template ratio as integer % (e.g. 66)
      const baseIn  = stdPct !== null ? m.officialIn  * (stdPct / 100) : null;
      const baseOut = (m.officialOut !== null && stdPct !== null) ? m.officialOut * (stdPct / 100) : null;
      const tplIn   = tplPct !== null ? m.officialIn  * (tplPct / 100) : null;
      const tplOut  = (m.officialOut !== null && tplPct !== null) ? m.officialOut * (tplPct / 100) : null;
      html += `<tr>
        <td>
          <div class="p-name">${m.name}</div>
          <div class="p-id">${m.id}</div>
        </td>
        <td><div>${m.billing.split('/')[0]}</div><div style="font-size:10px;color:var(--text-muted)">${m.billing.split('/')[1]}</div></td>
        <td><span class="p-base">${fmt(m.officialIn)}</span></td>
        <td><span class="p-base">${m.officialOut !== null ? fmt(m.officialOut) : '—'}</span></td>
        <td><span class="p-base">${fmt(baseIn)}</span></td>
        <td><span class="p-base">${fmt(baseOut)}</span></td>
        <td><span class="p-tpl">${fmt(tplIn)}</span></td>
        <td><span class="p-tpl">${fmt(tplOut)}</span></td>
        <td>${stdPct !== null
          ? `<span style="font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:#eef2ff;color:#4338ca;">${stdPct}% 官网</span>`
          : `<span class="ref-na">不开放</span>`}</td>
        <td>${tplPct !== null
          ? `<span class="p-disc-pill">${tplPct}% 官网</span>`
          : `<span class="ref-na">不开放</span>`}</td>
      </tr>`;
    });
  });
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('detailDrawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('detailDrawer').classList.remove('open');
}
function handleBackdropClick(e) {
  if (e.target === document.getElementById('detailDrawer')) closeDrawer();
}

// ── Archive ──────────────────────────────────────────────────
function archiveTemplate(id) {
  const t = TEMPLATES.find(x => x.id === id);
  if (!t) return;
  t.status = 'archived';
  renderList();
  showToast('模版已停用');
}

// ── Toast ────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Live price preview ────────────────────────────────────────
const PREVIEW_MODELS = [
  { name:'Qwen3-Max',     id:'qwen3-max',   vendor:'阿里云',   billing:'text', officialIn:2.5,  officialOut:10,  costRate:0.35 },
  { name:'DeepSeek-V3.2', id:'deepseek-v3', vendor:'DeepSeek', billing:'text', officialIn:2.0,  officialOut:8.0, costRate:0.60 },
  { name:'GLM-5',         id:'glm-5',       vendor:'智谱',     billing:'text', officialIn:4.0,  officialOut:18,  costRate:1.00 },
];

function updatePreview() {
  const el = document.getElementById('pricePreview');
  if (!el) return;
  const tier = selectedType;

  // Read current ratios from bracket inputs (or locked values)
  const currentRatios = FORM_BRACKETS.map((br, i) => {
    const inp = document.getElementById(`bi-${i}`);
    if (!inp) return br[tier]; // locked row
    const v = parseInt(inp.value, 10);
    return isNaN(v) ? br[tier] : v;
  });

  const rows = PREVIEW_MODELS.map(m => {
    const bIdx = bracketIndexFor(m.costRate);
    const br = FORM_BRACKETS[bIdx];
    const stdPct = br[tier]; // standard ratio as integer %
    const tplPct = currentRatios[bIdx];
    if (stdPct === null) return null;
    const stdIn  = m.officialIn  * (stdPct / 100);
    const stdOut = m.officialOut !== null ? m.officialOut * (stdPct / 100) : null;
    const tplIn  = m.officialIn  * (tplPct / 100);
    const tplOut = m.officialOut !== null ? m.officialOut * (tplPct / 100) : null;
    return { m, stdIn, stdOut, tplIn, tplOut, stdPct, tplPct };
  }).filter(Boolean);

  const tierLabel = tier === 'b' ? 'B端标准' : '代理商标准';
  el.innerHTML = `
    <div style="background:var(--bg-muted);padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);">价格预览（示例模型）</span>
      <span style="font-size:11px;color:var(--text-muted);">与${tierLabel}对比</span>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead>
        <tr style="background:var(--bg-muted);">
          <th style="padding:6px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);">模型</th>
          <th style="padding:6px 12px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);">官网原价·输入</th>
          <th style="padding:6px 12px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);">标准价·输入</th>
          <th style="padding:6px 12px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);">本模版·输入</th>
          <th style="padding:6px 12px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);">${tierLabel}折扣</th>
          <th style="padding:6px 12px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);">本模版折扣</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r,i) => `
          <tr style="${i < rows.length-1 ? 'border-bottom:1px solid var(--border-light)' : ''}">
            <td style="padding:8px 12px;color:var(--text);font-weight:500;">${r.m.name}</td>
            <td style="padding:8px 12px;text-align:right;color:var(--text-muted);">${fmt(r.m.officialIn)}</td>
            <td style="padding:8px 12px;text-align:right;color:var(--text-muted);">${fmt(r.stdIn)}</td>
            <td style="padding:8px 12px;text-align:right;font-weight:600;color:var(--text);">${fmt(r.tplIn)}</td>
            <td style="padding:8px 12px;text-align:right;">
              <span style="font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:#eef2ff;color:#4338ca;">${r.stdPct}% 官网</span>
            </td>
            <td style="padding:8px 12px;text-align:right;">
              <span style="font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:#dcfce7;color:#16a34a;">${r.tplPct}% 官网</span>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

// Init
renderList();
</script>
</body></html>
